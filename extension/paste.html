<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen to text · Read Aloud 2</title>
<link rel="stylesheet" href="content.css">
<style>
  @import url("pdf/tokens.css");
  body { margin: 0; background: var(--color-surface); color: var(--color-text); font: var(--text-20)/var(--leading-read) var(--font-ui); }
  main { max-width: 760px; margin: 0 auto; padding: var(--space-6) var(--space-4) 140px; }
  h1 { font-size: var(--text-28); line-height: var(--leading-28); margin: 0 0 var(--space-2); }
  textarea { width: 100%; min-height: 160px; font: inherit; font-size: var(--text-16); line-height: var(--leading-16); padding: var(--space-3); border: 1px solid var(--color-control-border); border-radius: var(--radius-1); background: var(--color-surface); color: var(--color-text); box-sizing: border-box; }
  button { margin: var(--space-3) 0 var(--space-5); height: var(--control-l); padding: 0 var(--space-5); border: 0; border-radius: var(--radius-round); background: var(--color-play); color: var(--color-on-play); font: inherit; font-size: var(--text-16); font-weight: 700; cursor: pointer; transition: background-color var(--dur-hover) var(--ease-out); }
  button:hover { background: var(--color-play-hover); }
  #out p { margin: 0 0 var(--space-4); }
</style>
</head>
<body>
<main>
  <h1>Listen to text</h1>
  <textarea id="src" placeholder="Paste any text here."></textarea>
  <button id="go" type="button">▶ Listen</button>
  <article id="out"></article>
</main>
<script src="paste.js"></script>
<script src="content.js"></script>
</body>
</html>
