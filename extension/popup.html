<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("pdf/tokens.css");
  body { margin: 0; width: 320px; background: var(--color-surface); color: var(--color-text); font: var(--text-16)/var(--leading-16) var(--font-ui); }
  main { padding: var(--space-4); display: grid; gap: var(--space-3); }
  h1 { font-size: var(--text-20); line-height: var(--leading-20); margin: 0; }
  .big { height: var(--control-l); border: 0; border-radius: var(--radius-round); background: var(--color-play); color: var(--color-on-play); font: inherit; font-weight: 700; font-size: var(--text-16); cursor: pointer; transition: background-color var(--dur-hover) var(--ease-out); }
  .big:hover { background: var(--color-play-hover); }
  label.f { display: grid; gap: var(--space-1); color: var(--color-text-muted); font-size: var(--text-14); }
  select, input[type=range] { width: 100%; font: inherit; accent-color: var(--color-action); }
  select { padding: var(--space-2); border: 1px solid var(--color-control-border); border-radius: var(--radius-1); background: var(--color-surface); color: var(--color-text); }
  .sw { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
  .sw input { width: 20px; height: 20px; accent-color: var(--color-action); }
  .sw[hidden] { display: none; }
  .links { display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: var(--text-14); } a { color: var(--color-text); }
  #server { font-size: var(--text-14); color: var(--color-text-muted); } #server b { color: var(--color-text); }
</style>
</head>
<body>
<main>
  <h1>Read Aloud 2</h1>
  <button class="big" id="read" type="button">▶ Listen to this page</button>
  <label class="f">Voice <select id="voice"></select></label>
  <label class="f">Speed <b id="rv"></b><input id="rate" type="range" min="0.5" max="4" step="0.1"></label>
  <label class="sw">Play button beside paragraphs <input type="checkbox" id="hoverPlay"></label>
  <label class="sw">Round listen button on every page <input type="checkbox" id="launcher"></label>
  <label class="sw">Page follows the voice <input type="checkbox" id="follow"></label>
  <label class="sw">Click a word to jump there while reading <input type="checkbox" id="clickJump"></label>
  <label class="sw">Open PDFs in Read Aloud 2 <input type="checkbox" id="pdf"></label>
  <label class="sw" id="siteRow">Hide on this site <input type="checkbox" id="site"></label>
  <p id="server"></p>
  <div class="links"><a href="pdf/index.html" target="_blank">Open a PDF</a><a href="paste.html" target="_blank">Listen to pasted text</a><a href="http://127.0.0.1:8793/" target="_blank">Voice sampler</a>
    <a href="#" id="keys">Keyboard shortcuts</a></div>
</main>
<script src="popup.js"></script>
</body>
</html>
